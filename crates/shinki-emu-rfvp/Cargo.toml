[package]
name = "shinki-emu-rfvp"
version = "0.6.0"
edition = "2024"
rust-version = "1.98"
license = "MPL-2.0"
build = "build.rs"

[lib]
name = "shinki_emu_rfvp"
crate-type = ["rlib", "cdylib"]
doctest = false

[features]
default = []
dynamic-plugin-export = ["shinki-emu-abi/diagnostic-bridge"]

[dependencies]
rfvp = { path = "../rfvp", default-features = false, features = ["embedded", "runtime-core-deps", "gpu-render", "audio", "mp4", "native-video", "random", "uuid-support", "image-formats", "bevy-utils", "fontdue-compat", "cursor-ani", "zlib-flate2", "logging"] }
shinki-emu-abi = { git = "https://github.com/Project-Shinkirou/ShinkiEMU", rev = "67f9c7cdd7a47de1fce75763aede958678c46d98" }
anyhow = "1"
parking_lot = "0.12"
winit = "0.30.5"

[build-dependencies]
shinki-emu-build = { git = "https://github.com/Project-Shinkirou/ShinkiEMU", rev = "9cd899babbb54cbc84c3e9fbddfe192c2f9200c8" }

[package.metadata.shinki]
upstream = "https://github.com/xmoezzz/rfvp"
upstream_revision = "99435f22e94eaec27c0c1b9f22cc2a6b1910d7d1"
license_notice = "THIRD_PARTY_NOTICES.md"
modifications = "MODIFICATIONS.md"
